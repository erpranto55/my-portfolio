<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Blue to Neon Pink Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring with Gradient -->
  <circle cx="256" cy="256" r="220" fill="#0a0c10" stroke="url(#neon-grad)" stroke-width="16" />
  
  <!-- Sleek ERP Monogram -->
  <g filter="url(#glow)">
    <!-- Main vertical stem -->
    <path d="M 256 140 L 256 372" 
          stroke="url(#neon-grad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    
    <!-- E branches (left) -->
    <path d="M 256 140 L 160 140 M 256 256 L 180 256 M 256 372 L 160 372" 
          stroke="url(#neon-grad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
          
    <!-- P loop (right top) -->
    <path d="M 256 140 C 350 140, 350 256, 256 256" 
          stroke="url(#neon-grad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
          
    <!-- R leg (right bottom) -->
    <path d="M 256 256 L 340 372" 
          stroke="url(#neon-grad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>
</svg>
